<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="container py-5">

        <!-- Header -->
     <!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

    <div>

        <h2 class="mb-1">
            Dashboard 📊
        </h2>

        <p class="text-muted mb-0">
            Track your daily expenses
        </p>

    </div>

    <div class="d-flex gap-2">

        <button
            class="btn btn-dark"
            onclick="toggleDarkMode()"
        >
            🌙
        </button>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</div>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">

            <div class="col-md-4">

                <div class="card summary-card h-100">

                    <h5>Total Expenses</h5>

                    <h3 id="totalExpense">
                        ₹0
                    </h3>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card summary-card h-100">

                    <h5>This Month</h5>

                    <h3 id="monthExpense">
                        ₹0
                    </h3>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card summary-card h-100">

                    <h5>Transactions</h5>

                    <h3 id="totalCount">
                        0
                    </h3>

                </div>

            </div>

        </div>

        <!-- Analytics -->
        <div class="card p-4 mb-4 text-center">

            <h4 class="mb-4">
                Expense Analytics
            </h4>

            <div
                style="
                    max-width: 250px;
                    height: 250px;
                    margin: auto;
                "
            >

                <canvas id="expenseChart"></canvas>

            </div>

        </div>

        <!-- Main Card -->
        <div class="card p-4">

            <!-- Add Expense -->
            <div class="mb-4">

                <h4 class="mb-3">
                    Add Expense
                </h4>

                <form id="expenseForm">

                    <div class="row g-3">

                        <div class="col-md-4">

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                placeholder="Expense title"
                                required
                            >

                        </div>

                        <div class="col-md-3">

                            <input
                                type="number"
                                class="form-control"
                                id="amount"
                                placeholder="Amount"
                                required
                            >

                        </div>

                        <div class="col-md-3">

                            <select
                                class="form-select"
                                id="category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Shopping">
                                    Shopping
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Education">
                                    Education
                                </option>

                            </select>

                        </div>

                        <div class="col-md-2">

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Add
                            </button>

                        </div>

                    </div>

                </form>

            </div>

            <!-- Expense Table -->
            <div>

                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">

                    <h4 class="mb-0">
                        Your Expenses
                    </h4>

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search expenses..."
                        style="max-width: 300px;"
                    >

                </div>

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Title</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="expenseTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit Expense
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="editId"
                    >

                    <div class="mb-3">

                        <label class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            id="editTitle"
                            class="form-control"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="editAmount"
                            class="form-control"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            id="editCategory"
                            class="form-select"
                        >

                            <option>Food</option>
                            <option>Transport</option>
                            <option>Shopping</option>
                            <option>Bills</option>
                            <option>Entertainment</option>
                            <option>Education</option>

                        </select>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        class="btn btn-primary"
                        onclick="updateExpense()"
                    >
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        let expenseChart;

        let allExpenses = [];

        function renderExpenses(expenses) {

            const table =
                document.getElementById(
                    "expenseTable"
                );

            table.innerHTML = "";

            expenses.forEach(expense => {

                table.innerHTML += `

                    <tr>

                        <td>${expense.id}</td>

                        <td>${expense.title}</td>

                        <td>₹${expense.amount}</td>

                        <td>${expense.category}</td>

                        <td class="d-flex gap-2">

                            <button
                                class="btn btn-warning btn-sm"
                                onclick="
                                    editExpense(
                                        ${expense.id},
                                        '${expense.title}',
                                        ${expense.amount},
                                        '${expense.category}'
                                    )
                                "
                            >
                                Edit
                            </button>

                            <button
                                class="btn btn-danger btn-sm"
                                onclick="
                                    deleteExpense(${expense.id})
                                "
                            >
                                Delete
                            </button>

                        </td>

                    </tr>
                `;
            });
        }

        async function fetchExpenses() {

            const token =
                localStorage.getItem("token");

            if (!token) {

                window.location.href =
                    "/login";

                return;
            }

            const response = await fetch(
                "http://127.0.0.1:5000/expenses",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

            const data =
                await response.json();

            allExpenses = data;

            let total = 0;

            const categoryTotals = {};

            document.getElementById(
                "totalCount"
            ).innerText = data.length;

            data.forEach(expense => {

                total += expense.amount;

                if (categoryTotals[expense.category]) {

                    categoryTotals[expense.category] += expense.amount;

                } else {

                    categoryTotals[expense.category] = expense.amount;
                }
            });

            document.getElementById(
                "totalExpense"
            ).innerText = `₹${total}`;

            document.getElementById(
                "monthExpense"
            ).innerText = `₹${total}`;

            // Chart
            const labels =
                Object.keys(categoryTotals);

            const values =
                Object.values(categoryTotals);

            const ctx =
                document.getElementById(
                    "expenseChart"
                );

            if (expenseChart) {

                expenseChart.destroy();
            }

            expenseChart = new Chart(ctx, {

                type: "pie",

                data: {

                    labels: labels,

                    datasets: [{

                        data: values,

                        borderWidth: 1
                    }]
                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {
                            position: "bottom"
                        }
                    }
                }
            });

            renderExpenses(data);
        }

        function logout() {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";
        }

        const expenseForm =
            document.getElementById(
                "expenseForm"
            );

        expenseForm.addEventListener(
            "submit",

            async function(event) {

                event.preventDefault();

                const token =
                    localStorage.getItem(
                        "token"
                    );

                await fetch(
                    "http://127.0.0.1:5000/expenses",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`
                        },

                        body: JSON.stringify({

                            title:
                                document.getElementById(
                                    "title"
                                ).value,

                            amount:
                                document.getElementById(
                                    "amount"
                                ).value,

                            category:
                                document.getElementById(
                                    "category"
                                ).value
                        })
                    }
                );

                expenseForm.reset();

                fetchExpenses();
            }
        );

        async function deleteExpense(id) {

            const token =
                localStorage.getItem(
                    "token"
                );

            await fetch(
                `http://127.0.0.1:5000/expenses/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

            fetchExpenses();
        }

        function editExpense(
            id,
            title,
            amount,
            category
        ) {

            document.getElementById(
                "editId"
            ).value = id;

            document.getElementById(
                "editTitle"
            ).value = title;

            document.getElementById(
                "editAmount"
            ).value = amount;

            document.getElementById(
                "editCategory"
            ).value = category;

            const modal =
                new bootstrap.Modal(
                    document.getElementById(
                        "editModal"
                    )
                );

            modal.show();
        }

        async function updateExpense() {

            const token =
                localStorage.getItem(
                    "token"
                );

            const id =
                document.getElementById(
                    "editId"
                ).value;

            await fetch(
                `http://127.0.0.1:5000/expenses/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({

                        title:
                            document.getElementById(
                                "editTitle"
                            ).value,

                        amount:
                            document.getElementById(
                                "editAmount"
                            ).value,

                        category:
                            document.getElementById(
                                "editCategory"
                            ).value
                    })
                }
            );

            fetchExpenses();

            bootstrap.Modal.getInstance(
                document.getElementById(
                    "editModal"
                )
            ).hide();
        }

        // Search
        document.getElementById(
            "searchInput"
        ).addEventListener(
            "keyup",

            function() {

                const searchValue =
                    this.value.toLowerCase();

                const filteredExpenses =
                    allExpenses.filter(expense =>

                        expense.title
                            .toLowerCase()
                            .includes(searchValue)

                        ||

                        expense.category
                            .toLowerCase()
                            .includes(searchValue)
                    );

                renderExpenses(filteredExpenses);
            }
        ); 

        function toggleDarkMode() {

    document.body.classList.toggle(
        "dark-mode"
    );

    if (
        document.body.classList.contains(
            "dark-mode"
        )
    ) {

        localStorage.setItem(
            "theme",
            "dark"
        );

    } else {

        localStorage.setItem(
            "theme",
            "light"
        );
    }
}

// Load saved theme
if (
    localStorage.getItem("theme")
    === "dark"
) {

    document.body.classList.add(
        "dark-mode"
    );
}

        fetchExpenses();

    </script>

</body>

</html>
